<!doctype html>
<html lang="en" data-rc="seo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SEO | Roof Command</title>
<script src="../lib/rc-frame-pause.js"></script><script src="../lib/rc-fetch-memo.js"></script><!-- one download per data file per page (11-02) --><!-- parked by the shell = no drawing -->
<!-- SEO: every blog post and service page Wing has published on the roofer's site. Data: the roofer's seo file (lib/brand.js rooferSeoUrl),
     written by scripts/seo/build_seo_jackson.py from the site repo (origin/main) and checked live. Real pages only.
     Layout (Jack 11-14, the Partner Outreach Home): the next page to go live in one bar, a strip of the real counts, then the next five
     (queue, then pages missing a keyword) and the newest live pages on the left, a publishing status card on the right.
     Every page is in the "See all" sheet. Parts and look: lib/rc-seoplan.css. Icons: lib/rc-icons.js. -->
<style>
@font-face{font-family:'Inter';font-style:normal;font-weight:100 900;font-display:swap;src:url(../lib/st-fonts/inter-var-latin.woff2) format('woff2')}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../lib/rc-apprules.css"><!-- app rules (11-02) -->
<link rel="stylesheet" href="../lib/rc-seoplan.css"><!-- SEO and Page plan parts (11-14) -->
<script src="../lib/rc-icons.js"></script>
</head>
<body>
<main class="sp" id="sp">
  <header class="sp-head">
    <h1 id="h">SEO</h1>
    <span class="sp-sub" id="sub"></span>
    <span class="sp-asof" id="asof"></span>
  </header>
  <div id="next"></div>
  <dl class="sp-strip sp-rise" id="strip" style="--i:1" aria-label="At a glance" hidden></dl>
  <div class="sp-main" id="mainrow" hidden>
    <div class="sp-left">
      <section class="sp-card sp-rise" id="queue" style="--i:2" aria-labelledby="hq" hidden>
        <div class="sp-ch"><h2 id="hq">Then these</h2><span class="sp-note" id="qn"></span></div>
        <ol class="sp-list" id="ql"></ol>
      </section>
      <section class="sp-card sp-rise" style="--i:3" aria-labelledby="hp">
        <div class="sp-ch"><h2 id="hp">Newest live pages</h2><button type="button" class="sp-link" id="all"></button></div>
        <ol class="sp-list" id="nl"></ol>
      </section>
    </div>
    <aside class="sp-side sp-rise" id="side" style="--i:3" aria-label="Publishing status"></aside>
  </div>
</main>
<dialog class="sp-dlg wide" id="dlg" aria-labelledby="dh">
  <div class="sp-dh"><div><small>On your website</small><h2 id="dh">Published pages</h2></div><button type="button" class="sp-x" id="dx" aria-label="Close"></button></div>
  <div class="sp-db">
    <div class="sp-ch" style="margin-bottom:4px">
      <span class="sp-note" id="n"></span>
      <div class="sp-seg" role="group" aria-label="Show">
        <button type="button" data-f="all" class="on" aria-pressed="true">All</button>
        <button type="button" data-f="blog" aria-pressed="false">Blog posts</button>
        <button type="button" data-f="service" aria-pressed="false">Service pages</button>
      </div>
    </div>
    <ol class="sp-list" id="list"></ol>
  </div>
</dialog>
<script>
(function(){
  const $=id=>document.getElementById(id);
  const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const LONG=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const day=iso=>{const [y,m,d]=String(iso).split('-').map(Number);return y?`${MON[m-1]} ${d}, ${y}`:'';};
  const short=iso=>{const [y,m,d]=String(iso).split('-').map(Number);return y?`${MON[m-1]} ${d}`:'';};
  const fmt=n=>Number(n||0).toLocaleString('en-US');
  const TYPE={blog:'Blog post',service:'Service page'}, TI={blog:'file-text',service:'wrench'};
  const root=$('sp');
  let D=null,F='all';
  const show=()=>requestAnimationFrame(()=>{ root.classList.add('in'); root.querySelectorAll('[data-w]').forEach(b=>{ b.style.width=b.dataset.w+'%'; }); setTimeout(()=>root.classList.add('done'),900); });

  /* one live page as a row: the title opens it on the roofer's website in a new tab */
  const pageRow=(i,k)=>`<li><a class="sp-row" href="${esc(i.url)}" target="_blank" rel="noopener" aria-label="Open ${esc(i.title)} on your website">
      <span class="sp-rk">${k}</span><span class="sp-ic">${RCI(TI[i.type]||'file-text')}</span>
      <span class="sp-rt"><b>${esc(i.title)}</b><small>${TYPE[i.type]||''} · ${i.keyword?esc(i.keyword):'No target keyword'}${i.gsc?` · ${fmt(i.gsc.clicks)} clicks`:''}</small></span>
      <span class="sp-rv"><span class="d">${short(i.date)}</span>${RCI('external-link')}</span></a></li>`;

  /* the sheet: every published page, newest first, filtered by type */
  function draw(){
    const items=D.items.filter(i=>F==='all'||i.type===F);
    $('n').textContent=`${items.length} ${items.length===1?'page':'pages'}, newest first`;
    $('list').innerHTML=items.length?items.map((i,k)=>pageRow(i,k+1)).join(''):'<li><p class="sp-empty">No pages of this type yet.</p></li>';
  }
  function paint(d){
    D=d; const c=d.counts, now=new Date(d.generated), items=d.items, q=d.next||[];
    const host=d.site.replace(/^https?:\/\//,'').replace(/\/$/,'');
    $('sub').textContent=d.roofer||''; $('asof').textContent=`Updated ${day(d.generated.slice(0,10))} from your live website`;
    const kw=items.filter(i=>i.keyword).length, newest=items[0], nokw=items.filter(i=>!i.keyword);

    /* 1. the next thing: the next page in Wing's queue (Open = the website it goes live on); no queue = the newest live page */
    const nx=$('next');
    if(q.length) nx.outerHTML=`<a class="sp-next sp-rise" id="next" style="--i:0" href="${esc(d.site)}" target="_blank" rel="noopener"><span class="sp-tile">${RCI('pen-line')}</span>
      <span class="sp-nt"><small>Publishing next</small><b>${esc(q[0].title)}</b><span>Target keyword: ${esc(q[0].keyword)} · goes live on ${esc(host)}</span></span>
      <span class="sp-open">Open${RCI('arrow-right')}</span></a>`;
    else if(newest) nx.outerHTML=`<a class="sp-next sp-rise" id="next" style="--i:0" href="${esc(newest.url)}" target="_blank" rel="noopener"><span class="sp-tile">${RCI(TI[newest.type]||'file-text')}</span>
      <span class="sp-nt"><small>Newest page</small><b>${esc(newest.title)}</b><span>${TYPE[newest.type]||''} · live ${day(newest.date)} on ${esc(host)}</span></span>
      <span class="sp-open">Open${RCI('arrow-right')}</span></a>`;
    else nx.outerHTML='<div class="sp-next plain sp-rise" id="next" style="--i:0"><span class="sp-nt"><b>No SEO pages published yet</b><span>Pages show here once they are live on your website.</span></span></div>';

    /* 2. the strip: counts straight from the file */
    const S=[['Pages live',fmt(c.total)],['Blog posts',fmt(c.blog)],['Service pages',fmt(c.service)],['Live in '+LONG[now.getMonth()],fmt(c.this_month)],['With a keyword',fmt(kw)],['No keyword yet',fmt(nokw.length)],['Queued next',fmt(q.length)]];
    if(d.gsc&&c.clicks!=null) S.push(['Clicks from Google',fmt(c.clicks)]);
    const st=$('strip'); st.hidden=false; st.style.setProperty('--n',S.length); st.innerHTML=S.map(([l,v])=>`<div><dt>${l}</dt><dd>${v}</dd></div>`).join('');

    /* 3 left, card one: the next five after the bar. The rest of the queue first, then live pages with no target keyword (newest first) */
    $('mainrow').hidden=false;
    const nq=Math.max(0,q.length-1);
    const T=q.slice(1).map(x=>({ic:'pen-line',t:x.title,s:`Queued · target keyword: ${x.keyword}`,v:'Queued'}))
      .concat(nokw.map(i=>({ic:'target',t:i.title,s:`Set a target keyword · ${TYPE[i.type]||'Page'}, live ${short(i.date)}`,v:'Fix',u:i.url}))).slice(0,5);
    if(T.length){ $('queue').hidden=false; const nf=T.length-Math.min(nq,T.length);
      $('qn').textContent=[nq?`${Math.min(nq,T.length)} queued`:'',nf?`${nf} keyword ${nf===1?'fix':'fixes'}`:''].filter(Boolean).join(', then ');
      $('ql').innerHTML=T.map((x,k)=>{ const inner=`<span class="sp-rk">${k+2}</span><span class="sp-ic">${RCI(x.ic)}</span>
        <span class="sp-rt"><b>${esc(x.t)}</b><small>${esc(x.s)}</small></span><span class="sp-rv"><span class="sp-chip${x.u?'':' q'}">${x.v}</span>${x.u?RCI('external-link'):''}</span>`;
        return x.u?`<li><a class="sp-row" href="${esc(x.u)}" target="_blank" rel="noopener" aria-label="Open ${esc(x.t)} on your website">${inner}</a></li>`:`<li><div class="sp-row">${inner}</div></li>`; }).join(''); }

    /* 3 left, card two: the three newest live pages; See all opens the sheet */
    $('nl').innerHTML=items.length?items.slice(0,3).map((i,k)=>pageRow(i,k+1)).join(''):'<li><p class="sp-empty">Pages show here once they are live.</p></li>';
    $('all').textContent=`See all ${items.length}`; $('all').hidden=!items.length;

    /* 3 right. status: keywords set, the newest page, pages live by month (last 6, from the real dates), the last publishing days */
    const months=[]; for(let k=5;k>=0;k--){ const t=new Date(now.getFullYear(),now.getMonth()-k,1); months.push({y:t.getFullYear(),m:t.getMonth(),n:0}); }
    items.forEach(i=>{ const [y,m]=String(i.date).split('-').map(Number); const b=months.find(x=>x.y===y&&x.m===m-1); if(b) b.n++; });
    const mx=Math.max(1,...months.map(x=>x.n)), kp=items.length?Math.round(kw/items.length*100):0;
    const days=[]; items.forEach(i=>{ const l=days[days.length-1]; if(l&&l.d===i.date) l.n++; else days.push({d:i.date,n:1}); });
    $('side').innerHTML=`<div class="sp-sh"><span class="sp-tile black">${RCI('globe')}</span><div class="sp-st"><b>Publishing</b><small>${esc(host)}</small></div></div>
      <div><div class="sp-steps one"><i data-w="${kp}"></i></div><div class="sp-pl"><span>Pages with a target keyword</span><b class="sp-num">${fmt(kw)} of ${fmt(items.length)}</b></div></div>
      ${newest?`<div class="sp-now"><div><span>Newest page</span><b>${day(newest.date)}</b></div><b>${esc(newest.title)}</b></div>`:''}
      <div class="sp-fh">Pages live by month</div>
      <dl class="sp-fun">${months.map(x=>`<dt>${MON[x.m]} ${x.y}</dt><dd class="sp-bar"><i data-w="${Math.round(x.n/mx*100)}"></i></dd><dd class="${x.n?'':'z'}">${x.n}</dd>`).join('')}</dl>
      <ul class="sp-log">${days.slice(0,3).map((x,k)=>`<li>${RCI(k?'arrow-right':'check')}<span>${day(x.d)}: ${x.n} ${x.n===1?'page':'pages'} went live</span></li>`).join('')}</ul>`;
    draw(); show();
  }
  $('dx').innerHTML=RCI('x');
  $('all').addEventListener('click',()=>$('dlg').showModal());
  $('dx').addEventListener('click',()=>$('dlg').close());
  $('dlg').addEventListener('click',e=>{ if(e.target===$('dlg')) $('dlg').close(); });
  document.querySelector('.sp-seg').addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b) return; F=b.dataset.f;
    document.querySelectorAll('.sp-seg button').forEach(x=>{const on=x===b;x.classList.toggle('on',on);x.setAttribute('aria-pressed',on);});
    if(D) draw();
  });
  /* the roofer's list comes from the registry (lib/brand.js rooferSeoUrl): the app shell's when this screen is inside it
     (no extra download), else brand.js is loaded here. A roofer whose entry has no list (seo null) reads "No SEO pages
     published yet": nothing failed. A fetch that fails, or an unknown roofer, keeps the did-not-load line. */
  const say=(t,s)=>{ $('next').outerHTML=`<div class="sp-next plain sp-rise" id="next" style="--i:0"><span class="sp-nt"><b>${t}</b><span>${s}</span></span></div>`; show(); };
  const fail=()=>say('The SEO list did not load','Refresh to try again.');
  const none=()=>say('No SEO pages published yet','Pages show here once they are live on your website.');
  const go=(u,w)=>{ if(!u) return w&&w.rooferMissing&&!w.rooferMissing()?none():fail(); fetch(u,{cache:'no-cache'}).then(r=>{if(!r.ok) throw 0; return r.json();}).then(paint).catch(fail); };
  let up=null; try{ if(window.parent!==window&&window.parent.rooferSeoUrl) up=window.parent; }catch(e){ up=null; }
  if(up) go(up.rooferSeoUrl(),up);
  else{ const s=document.createElement('script'); s.src='../lib/brand.js'; s.onload=()=>go(window.rooferSeoUrl?rooferSeoUrl():null,window); s.onerror=fail; document.head.appendChild(s); }
  window.__ready=true;
})();
</script>
</body>
</html>
