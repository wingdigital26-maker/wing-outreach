@font-face{font-family:'Inter';font-style:normal;font-weight:100 900;font-display:swap;src:url(lib/st-fonts/inter-var-latin.woff2) format('woff2')}
:root{--paper:#0B1020;--muted:#465065;--blue:#2757E6;--bar:#E6E8ED;--hair:rgba(11,16,32,.14);--roofer:#0D6C99}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Inter',system-ui,sans-serif;color:var(--paper);display:flex;flex-direction:column;
  background:radial-gradient(ellipse 60% 48% at 50% 40%,rgba(255,255,255,.95),rgba(255,255,255,0) 70%),
  linear-gradient(180deg,#B9BEC9 0%,#D5D9E0 30%,#ECEEF2 62%,#F7F8FA 100%)}
/* ONE header, roofer-led, in the page bar's own pill style (c4-command-deck/dk.css .bar) */
header{display:flex;align-items:center;gap:12px;height:64px;padding:0 24px;background:rgba(230,232,237,.72);backdrop-filter:blur(10px);border-bottom:1px solid var(--hair)}
.co{display:flex;align-items:center;gap:12px;min-width:0;flex:0 1 auto}   /* Inter runs wider: the city line gives way first */
.co>div{min-width:0}
.co .mark{width:36px;height:36px;border-radius:10px;background:var(--roofer);display:grid;place-items:center;flex:none}
.co .mark svg{width:20px;height:20px}
.co b{display:block;font-weight:700;font-size:15px;letter-spacing:-.01em;white-space:nowrap;line-height:1.15}
.co small{display:block;font-size:12px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav{display:flex;gap:4px;margin-left:8px;padding:4px;border-radius:999px;background:rgba(255,255,255,.55);border:1px solid var(--hair);overflow-x:auto;scrollbar-width:none;flex:none;max-width:100%}nav::-webkit-scrollbar{display:none}
nav button{white-space:nowrap;flex:none;font:inherit;font-size:13.5px;font-weight:500;border:0;background:transparent;color:var(--muted);padding:7px 16px;border-radius:999px;cursor:pointer;transition:background .2s ease,color .2s ease}
nav button:hover{background:rgba(255,255,255,.9);color:var(--paper)}
nav button.on{background:var(--paper);color:#fff}
nav button:focus-visible,.find:focus-within,.me:focus-visible{outline:2px solid #1F47C9;outline-offset:2px}
.sp{flex:1}
.find{display:flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--hair);background:rgba(255,255,255,.7);color:var(--muted);font-size:13px;width:220px;flex:none}
.find svg{width:15px;height:15px;flex:none}
.find input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:13px;color:var(--paper);outline:none}
.find input::placeholder{color:var(--muted)}
.sig{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);white-space:nowrap;flex:none}
.sig svg{width:13px;height:13.6px}
.sig b{color:var(--paper);font-weight:600}
.me{width:34px;height:34px;border-radius:50%;background:#fff;display:grid;place-items:center;font-weight:600;font-size:13px;border:1px solid var(--hair);flex:none}
main{flex:1;display:flex;justify-content:center;align-items:center;padding:12px 12px 12px;min-height:0}
/* the stage holds one kept-alive frame per screen; switching screens is a fade out / rise in, never a reload */
.stage{position:relative;width:100%;height:100%;border-radius:14px;background:#fff;box-shadow:0 10px 40px rgba(11,16,32,.12);transition:width .3s ease,border-radius .3s ease;overflow:hidden}
.frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;opacity:0;transform:translateY(16px);visibility:hidden;pointer-events:none;
  transition:opacity .4s ease-out,transform .4s ease-out,visibility 0s linear .4s}
.frame.on{opacity:1;transform:none;visibility:visible;pointer-events:auto;transition-delay:0s;z-index:2}
/* the outgoing screen stays painted under the incoming one (z-index 1) and only fades once the new screen is in, so the
   stage grey never shows through the cross-fade (Jack 11-02: a blank grey frame at the opening's handoff) */
.frame.out{opacity:0;transform:none;visibility:visible;z-index:1;transition:opacity .25s ease-out .4s,visibility 0s linear .65s}
.frame.parked{display:none}   /* parked frames keep their document and state but stop painting */
/* APP-RULES 10 (Jack 11-02): a screen that is still loading shows its real layout as a skeleton, never a blank. The skeleton
   sits over the stage, in the canvas grey with white blocks where the screen's cards land, and fades once the frame has
   painted real content (the shell polls the frame: text in the panel, the map drawn, the hero up). */
.skel{position:absolute;inset:0;z-index:5;background:#f1f2f4;padding:24px;display:none;pointer-events:none;opacity:1;transition:opacity .2s ease-out}
.skel.show{display:block}
.skel.fade{opacity:0}
.skel i{display:block;background:#fff;border-radius:24px;animation:skpulse 1.4s ease-in-out infinite}
.skel i.t{background:#e4e6ea;border-radius:8px;height:14px;animation-delay:.2s}
.skel i.d{background:#dfe1e5}
.skel .r{display:grid;gap:20px;margin-bottom:20px}
.skel[data-for="today"] .h{height:28px;width:120px;margin-bottom:8px}.skel[data-for="today"] .s{height:14px;width:260px;margin-bottom:20px}
.skel[data-for="today"] .r1{grid-template-columns:minmax(0,1.7fr) minmax(300px,1fr)}.skel[data-for="today"] .r1 i{height:250px}
.skel[data-for="today"] .r2{grid-template-columns:repeat(4,minmax(0,1fr))}.skel[data-for="today"] .r2 i{height:210px}
.skel[data-for="today"] .r3{grid-template-columns:288px minmax(400px,480px) minmax(0,1fr)}.skel[data-for="today"] .r3 i{height:420px}
.skel[data-for="storm"]{padding:0}.skel[data-for="storm"] .map{position:absolute;inset:0;background:#e9ebee;border-radius:0;animation:none}
.skel[data-for="storm"] .bar{position:absolute;left:16px;right:16px;top:14px;height:44px;border-radius:999px}
.skel[data-for="storm"] .box{position:absolute;left:16px;top:72px;width:318px;height:64px;border-radius:16px}
.skel[data-for="storm"] .pill{position:absolute;right:16px;bottom:16px;width:160px;height:36px;border-radius:999px}
.skel[data-for="home"] .tabs{height:44px;width:600px;border-radius:999px;margin-bottom:20px}
.skel[data-for="home"] .r1{grid-template-columns:340px minmax(0,1fr) 360px}.skel[data-for="home"] .r1 i{height:calc(100vh - 150px);min-height:420px}
.skel[data-for="find"] .h{height:28px;width:160px;margin-bottom:8px}.skel[data-for="find"] .s{height:14px;width:320px;margin-bottom:20px}
.skel[data-for="find"] .r1{grid-template-columns:340px minmax(0,1fr)}.skel[data-for="find"] .r1 i{height:calc(100vh - 170px);min-height:400px}
.skel[data-for="seo"] .hd,.skel[data-for="results"] .hd{height:88px;border-radius:24px 24px 0 0;margin-bottom:1px}
.skel[data-for="seo"] .r1,.skel[data-for="results"] .r1{grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;margin-bottom:1px}.skel[data-for="seo"] .r1 i,.skel[data-for="results"] .r1 i{height:110px;border-radius:0}
.skel[data-for="seo"] .rows{height:calc(100vh - 290px);min-height:260px;border-radius:0 0 24px 24px}
.skel[data-for="results"] .r2{grid-template-columns:repeat(2,minmax(0,1fr))}.skel[data-for="results"] .r2 i{height:300px}
@keyframes skpulse{0%,100%{opacity:1}50%{opacity:.55}}
@media (max-width:939px){.skel[data-for="today"] .r1,.skel[data-for="home"] .r1,.skel[data-for="find"] .r1{grid-template-columns:minmax(0,1fr)}.skel[data-for="today"] .r2{grid-template-columns:repeat(2,minmax(0,1fr))}.skel[data-for="today"] .r3{display:none}.skel[data-for="home"] .tabs{width:100%}}
@media (prefers-reduced-motion:reduce){.skel i{animation:none}.skel{transition:none}}
main.phone .stage{width:390px;height:min(844px,100%);border-radius:28px}
@media (prefers-reduced-motion:reduce){.frame,.frame.out,.stage{transition:none}}
@media (max-width:1180px){.sig{display:none}.find{width:170px}}
@media (max-width:900px){
  header{flex-wrap:wrap;height:auto;padding:8px 14px 8px;gap:8px 10px}
  .co{order:0}.sp{order:1}.find{order:2;width:36px;padding:0;justify-content:center}.find input{display:none}.me{order:3}
  nav{order:5;flex:1 1 100%;margin:0;max-width:none}
}
@media (max-width:599px){
  header{padding:8px 14px 4px;gap:6px 8px}
  .find{width:44px;height:44px;order:2}
  .me{width:44px;height:44px;order:3}
  main{padding:6px 8px 8px}
  .co{flex:1 1 0;min-width:0}.co>div{min-width:0}.co .mark{width:32px;height:32px}.co b{font-size:14px;overflow:hidden;text-overflow:ellipsis}.co small{font-size:11.5px;overflow:hidden;text-overflow:ellipsis}
  .sp{display:none}
  nav{background:transparent;border:0;padding:0;margin:0 -14px;padding:0 14px}
  nav{justify-content:space-between}
  nav button{padding:8px 12px;font-size:14px;min-height:44px;flex:1 1 0}
  .frame{border-radius:10px}
}
</style>

/* 700 to 1023px: the sidebar (224px) is showing and a notice centred on the window covered its account button (768px) or Nimbus

@media (max-width:529px){ html[data-rc="shell"] #rcUnsaved{bottom:calc(106px + env(safe-area-inset-bottom,0px))} }   /* clear of the two-row tab bar (98px) */
</style>

<script>
/* One shell, real routes. #/opening (About), #/storm, #/storm/<iso>, #/daily, #/daily/<n>, #/ask (?q=, opens the Nimbus panel), and the CRM:
   #/crm (inbox), #/crm/inbox/<id> (a thread open), #/crm/pipeline (the board), #/crm/home/<id> (one home's record).
   #/home/<id> still works as an alias of #/crm/home/<id> (RC.go('home', {id}) from Today, Storms and Nimbus).
   Every route is a history entry, so Back moves between screens and never leaves the app.
   Frames ask for a screen with RC.go() (postMessage {type:'go'}) and the shell routes it. ?tab= deep links still work. */
/* opening = the first-run intro (and #/opening/about), never a nav tab */
const screens={
  opening:{label:'About Roof Command',page:'1a-storm-intro.html'},
  storm:{label:'Storms',page:'1b-storm-theater.html'},
  daily:{label:'Today',page:'c4-command-deck/deck.html'},
  home:{label:'CRM',page:'c5-home/index.html',path:'crm'},   /* screen key stays 'home' (RC.go('home') everywhere); the URL says crm */
  find:{label:'Find',page:'c10-find/index.html'},   /* Find homes (10-26): search + saved searches + best blocks + rep lists (lib/rc-scores.js) */
  seo:{label:'SEO',page:'c8-seo/index.html'},   /* the blog posts and service pages Wing published for the roofer (lib/seo-jackson.json, 10-26) */
  pages:{label:'Page plan',page:'pages.html'},   /* which pages to make next, ranked by local roof demand (scripts/pages/plan_pages.py -> meta/pages/<market>.json, 11-08) */
  results:{label:'Results',page:'c9-results/index.html'}   /* leads, inspections, jobs won and revenue by lead source (lib/rc-results.js, migration 012, 10-26) */
  /* Weekly (c7-weekly) removed from the app (Jack 10-15); old #/weekly links land on Today via ALIAS */
};
/* Ask is no longer a tab (Jack 10-11): the Nimbus orb, bottom-right, opens the full Ask Nimbus page (c2-nimbus) as a panel.
   #/ask and RC.go('ask') open that panel on whatever screen is up. */
const ALIAS={crm:'home',weekly:'daily'};
const ORDER=['daily','storm','home','find','seo','pages','results'];
const nav=document.getElementById('nav'),stage=document.getElementById('f'),main=document.getElementById('main');
const PLACEHOLDER='<!doctype html><meta charset=utf-8><style>@font-face{font-family:"Inter";font-style:normal;font-weight:100 900;font-display:swap;src:url(lib/st-fonts/inter-var-latin.woff2) format("woff2")}body{margin:0;height:100vh;display:grid;place-items:center;font-family:"Inter",system-ui,sans-serif;color:#0B1020;background:#F7F8FA}div{text-align:center;max-width:420px;padding:24px}h1{font-size:22px;font-weight:600;margin:0 0 8px}p{margin:0;color:#465065;line-height:1.5}</style><div><h1>This screen did not load</h1><p>This is usually a weak connection. Your leads and notes are safe.</p><p style="margin-top:16px"><button type="button" onclick="parent.location.reload()" style="font:inherit;font-size:14px;font-weight:600;min-height:44px;padding:0 20px;border:0;border-radius:10px;background:#0B1020;color:#fff;cursor:pointer">Try again</button></p></div>';
const q=new URLSearchParams(location.search);
const NOINTRO=q.get('nointro')==='1';
const NOPREFETCH=q.get('noprefetch')==='1';   // capture scripts on a software GPU: do not warm the next screen
const ss={get(k){try{return sessionStorage.getItem(k)}catch(e){return null}},set(k,v){try{sessionStorage.setItem(k,v)}catch(e){}}};
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
let cur=null,briefed=false;
const frames={};            // screen -> {el, src, loaded}
window.__frames=frames;     // the nav-time check reads which screens are warm
/* APP-RULES 10 (Jack 11-02, "make it so this stuff preloads"): after the first screen is usable every other screen loads in the
   background, lightest first, heavy maps last, each on an idle slot after the one before it; frames stay alive and parked
   (rc-frame-pause.js stops their drawing), so a nav click shows the screen at once. Not under the opening: after it. */
/* Jack 11-02 ("why does it keep freezing"): measured with the full queue the JS heap sat at 1.5 GB against 0.34 GB without it,
   almost all of it the Storms frame (271k homes in deck.gl) drawn hidden. So only the light screens preload; Storms gets its
   data files warmed into the cache (no frame, no drawing) and its frame on hover over the nav item; a machine with 4 GB or
   less (navigator.deviceMemory) preloads SEO and Results only. */
const LOWMEM=!!(navigator.deviceMemory&&navigator.deviceMemory<=4);
const WARM_ORDER=LOWMEM?['daily','seo','results']:['daily','seo','results','find','home'];
const STORM_DATA=rooferMissing()?[]:['catalog.json','latest-storm.json','homes.bin'].map(f=>rooferDataRoot()+f);   /* the roofer's own data folder (lib/brand.js); an unknown roofer warms nothing */
window.__switch={last:0};   // tab-switch timing for the Playwright check

/* ---- routes ---- */
/* the CRM's segment: '' (inbox) | inbox/<id> | pipeline | calendar | home/<id>; an id with no view = that home's record (the old route) */
function crmSeg(params){
  const id=params.id?encodeURIComponent(params.id):'';
  if(params.view==='pipeline') return 'pipeline';
  if(params.view==='calendar') return 'calendar';   /* #/crm/calendar: the built-in calendar (c5-home/cal.js) */
  if(params.view==='customers') return 'customers';   /* #/crm/customers: Past customers (c5-home/customers.js, 10-26) */
  if(params.view==='inbox') return id?'inbox/'+id:'';
  return id?'home/'+id:'';
}
function hashFor(screen,params){
  params=params||{};
  if(screen==='home'){ const seg=crmSeg(params); return '#/'+screens.home.path+(seg?'/'+seg:''); }
  const seg=screen==='storm'?params.iso:screen==='daily'?params.n:screen==='opening'&&params.about?'about':'';
  return '#/'+screen+(seg?'/'+encodeURIComponent(seg):'');
}
function parseHash(h){
  const m=/^#\/([a-z]+)(?:\/([^?]+))?(?:\?(.*))?$/.exec(h||'');
  if(!m) return null;
  if(m[1]==='ask'){ const p=new URLSearchParams(m[3]||''); return {screen:cur&&cur!=='opening'?cur:'daily',params:{},ask:p.get('q')||''}; }   /* the old Ask route: stay put, open the Nimbus panel */
  const screen=ALIAS[m[1]]||m[1]; if(!screens[screen]) return null;

  const typing=/^(INPUT|TEXTAREA|SELECT)$/.test((e.target&&e.target.tagName)||'')||(e.target&&e.target.isContentEditable);
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); RCFind.open(); return; }
  if(typing||e.ctrlKey||e.metaKey||e.altKey) return;
  const n=parseInt(e.key,10); if(n>=1&&n<=ORDER.length) go(ORDER[n-1],{});
});
/* first paint (after sign-in, lib/auth.js): ?tab= deep link, else the hash, else the opening once per session, else Today */
RCT_AUTH.gate(function start(){
  const tab=ALIAS[q.get('tab')]||q.get('tab');
  if(tab&&screens[tab]&&!location.hash){ go(tab,tab==='opening'?{about:'1'}:{},true); return; }
  if(location.hash&&parseHash(location.hash)){ const r=parseHash(location.hash); if(r.screen==='opening'&&!r.params.about&&(NOINTRO||ss.get('rc.introSeen'))){ go('daily',{},true); return; } render(); return; }
  if(NOINTRO||ss.get('rc.introSeen')){ go('daily',{},true); return; }
  startLoading();
});
</script>
<script>/* offline cache (sw.js): repeat visits and tab switches load from disk on the hosted build. Registered after the first screen is up; ?nosw=1 or localhost removes it. */
if('serviceWorker' in navigator){ if(/[?&]nosw=1/.test(location.search)||/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)) /* on the laptop the cache served stale code and re-saved ~39 MB every load (10-17): local always loads fresh */ navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).then(()=>window.caches&&caches.keys().then(ks=>ks.forEach(k=>caches.delete(k)))).catch(()=>{});
  else addEventListener('load',()=>setTimeout(()=>(window.requestIdleCallback||setTimeout)(()=>{ if(RCT_AUTH.ok()) navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{}); },{timeout:8000}),6000)); }   /* 11-02: the worker's precache (about 100 files) used to start 1 s after load and competed with the first screen's own downloads; it now waits 6 s */</script>
<script>/* "Not saved" notice: shows after two cloud syncs fail in a row while signed in, hides on the next good sync */
(function(){ var el=document.getElementById("rcUnsaved"), b=document.getElementById("rcUnsavedTry"); if(!el) return;
  function tick(){ var c=window.RC_CLOUD, s=c&&c.status(); el.hidden=!(s&&s.on&&s.fails>=2); }
  b.onclick=function(){ b.textContent="Trying"; var p=window.RC_CLOUD&&RC_CLOUD.syncNow(); (p&&p.then?p:Promise.resolve()).then(function(){ b.textContent="Try now"; tick(); }); };
  setInterval(tick,3000); })();</script>
